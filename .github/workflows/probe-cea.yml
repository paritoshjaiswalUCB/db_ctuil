# One-off connectivity probe: can GitHub's runners reach cea.nic.in?
name: Probe CEA

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reach the CEA listing feed and one minutes file
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          for i in 1 2 3; do
            curl -s -o feed.json -m 40 -A "$UA" -w "feed attempt $i: http=%{http_code} bytes=%{size_download} time=%{time_total}s\n" \
              "https://cea.nic.in/api/public/link-report/getByMappingId/377" || echo "feed attempt $i: failed"
            [ -s feed.json ] && break
            sleep 10
          done
          head -c 200 feed.json || true; echo
