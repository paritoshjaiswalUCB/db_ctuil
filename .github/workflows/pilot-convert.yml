# Pilot of table-aware re-conversion (convert/pilot.py). Converts the files in convert/pilot_files.csv and keeps the
# results as a downloadable artifact. Does not touch Drive and needs no secrets.
name: Pilot convert

on:
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr
          pip install pymupdf==1.28.2 pytesseract Pillow requests

      - name: Convert the pilot files
        run: python convert/pilot.py

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-convert-${{ github.run_number }}
          path: convert/pilot_out/
          if-no-files-found: ignore
