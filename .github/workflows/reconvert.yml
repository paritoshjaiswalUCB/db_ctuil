# Re-convert documents made by the old plain-text converter with the table-aware one (convert/reconvert.py).
# Runs daily until nothing is left (then it finishes in minutes), and on request. Shares the weekly job's
# concurrency group so the two never write to Drive at the same time.
name: Reconvert (table-aware)

on:
  schedule:
    - cron: "30 20 * * *"  # 02:00 IST
  workflow_dispatch:

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  reconvert:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KB_ROOT: ${{ github.workspace }}/kb
      DRIVE_PATH: "gdrive:db_cmets_meetings"
      PYTHONIOENCODING: utf-8
      RECONVERT_BUDGET_MIN: "240"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr rclone

      - name: Install Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Configure Drive access
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}

      - name: Pull knowledge base from Drive
        run: rclone copy "$DRIVE_PATH" "$KB_ROOT" --transfers 8 --stats-one-line --stats 30s

      - name: Re-convert with the table-aware converter
        timeout-minutes: 260
        run: python -m convert.reconvert

      - name: Link documents to applications, applicants and substations
        if: always()
        run: python gna/link_documents.py

      - name: Update search index
        if: always()
        run: python rag/build_index.py

      - name: Push changes back to Drive
        if: always()
        run: rclone copy "$KB_ROOT" "$DRIVE_PATH" --transfers 8 --stats-one-line --stats 30s
